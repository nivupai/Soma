name: Scientific SDK checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: sdk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  MPLBACKEND: Agg
  MPLCONFIGDIR: /tmp/soma-mpl
  XDG_CACHE_HOME: /tmp/soma-cache
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  ITK_GLOBAL_DEFAULT_NUMBER_OF_THREADS: '1'
  LOKY_MAX_CPU_COUNT: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  # Prevent forced ANSI styles from splitting literal CLI options in captured help.
  NO_COLOR: '1'
  TERM: dumb
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install '.[dev,explorer]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy --strict src/soma services
      - run: python -m pip check
  scientific:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install '.[dev,explorer]'
      - run: mypy --strict src/soma services
      - run: pytest
      - run: python -m scripts.run_sdk_examples --output reports/examples.json
      - run: soma --help && soma datasets list
      - run: soma experiments synthetic-spectrum --output reports/ci-synthetic
      - run: soma experiments event-locked --no-plots --output reports/ci-event-locked
      - run: soma experiments cohort-synthetic --no-plots --output reports/ci-cohort --cache-dir data/derived/ci-cache
      - run: soma stats calibrate --config configs/calibration-smoke.yaml --workers 2 --no-plots --output reports/ci-calibration
      - run: soma decode --help && soma decode synthetic --help && soma decode evaluate-heldout --help
      - run: soma source --help && soma source simulate --help
      - run: soma mri --help && soma mri experiment synthetic --help
  distributions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install build
      - run: python -m build
      - run: python scripts/inspect_distributions.py dist/*.whl dist/*.tar.gz
      - run: python scripts/verify_install.py dist/soma_neuro-0.24.0-py3-none-any.whl --env .venv-wheel
      - run: python scripts/verify_install.py dist/soma_neuro-0.24.0.tar.gz --env .venv-sdist
      - run: python scripts/verify_install.py . --env .venv-source
      - run: python scripts/check_reproducible_build.py
  explorer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/explorer/package-lock.json
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install '.[dev,explorer]'
      - run: npm --prefix apps/explorer ci
      - run: apps/explorer/node_modules/.bin/playwright install chromium --with-deps --only-shell
      - run: npm --prefix apps/explorer run typecheck
      - run: npm --prefix apps/explorer run lint
      - run: npm --prefix apps/explorer run format
      - run: npm --prefix apps/explorer run test
      - run: npm --prefix apps/explorer run build
      - run: npm --prefix apps/explorer audit --audit-level=moderate
      # Backend is installed noneditably; source checkout remains the frontend host.
      - run: .venv/bin/python scripts/prepare_protocol_explorer.py --root reports/protocol-histories --config reports/protocol-explorer.local.json
      - run: npm --prefix apps/explorer run e2e
        env:
          SOMA_EXPLORER_INSTALLED: '1'
          SOMA_EXPLORER_CONFIG: ${{ github.workspace }}/reports/protocol-explorer.local.json
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install '.[explorer]' pip-audit
      - run: python scripts/install_gitleaks.py /tmp/gitleaks
      - run: python scripts/privacy_check.py --gitleaks /tmp/gitleaks --output reports/security
      - run: python -m pip_audit --progress-spinner off

  reproducibility:
    name: reproducibility (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install '.[dev,explorer]'
      - name: Verify actual platform architecture
        run: python -c "import platform; assert platform.machine() == ('arm64' if platform.system() == 'Darwin' else 'x86_64')"
      - run: pytest tests/results tests/workflow tests/protocol tests/human tests/readiness tests/eeg_benchmark tests/external_eeg tests/model_archive
      - run: soma results verify-reproducibility reports/cross-platform.json
      - run: python -m examples.result_schemas
      - run: python scripts/replay_workflows.py --cache reports/workflow-cache --output reports/workflow-replay.json
      - run: python scripts/human_identity_repro.py --output reports/human-identity.json
      - run: python -m scripts.research_readiness_repro --output reports/readiness-evidence.json
      - run: python -m scripts.eeg_benchmark_repro --output reports/eeg-benchmark-synthetic.json
      - run: python -m scripts.external_eeg_repro --output reports/external-eeg-synthetic.json
      - run: python -m scripts.model_archive_repro --output reports/model-archive-synthetic.json
      - run: python scripts/run_protocol_demonstrations.py --root reports/protocol-histories --output reports/protocol-replay.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-repro-${{ matrix.os }}-${{ matrix.python }}
          path: |
            reports/cross-platform.json
            reports/workflow-replay.json
            reports/protocol-replay.json
            reports/human-identity.json
            reports/readiness-evidence.json
            reports/eeg-benchmark-synthetic.json
            reports/external-eeg-synthetic.json
            reports/model-archive-synthetic.json
          retention-days: 14
  dependency-floor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -c configs/reproducibility-floor.txt '.[dev,explorer]'
      - run: pytest tests/results tests/workflow tests/protocol tests/human tests/readiness tests/eeg_benchmark tests/external_eeg tests/model_archive
      - run: soma results verify-reproducibility reports/dependency-floor.json

  cross-platform-comparison:
    needs: reproducibility
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: synthetic-repro-*
          path: reports/platforms
      - run: python scripts/compare_platform_reports.py reports/platforms --output reports/platform-comparison.json
      - run: python scripts/compare_workflow_replays.py reports/platforms --output reports/workflow-comparison.json
      - run: python scripts/compare_protocol_replays.py reports/platforms --output reports/protocol-comparison.json
      - run: python scripts/compare_human_identity.py reports/platforms --output reports/human-identity-comparison.json
      - run: python scripts/compare_readiness_evidence.py reports/platforms --output reports/readiness-evidence-comparison.json
      - run: python scripts/compare_eeg_benchmarks.py reports/platforms --output reports/eeg-benchmark-comparison.json
      - run: python scripts/compare_external_eeg.py reports/platforms --output reports/external-eeg-comparison.json
      - run: python scripts/compare_model_archives.py reports/platforms --output reports/model-archive-comparison.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-platform-comparison
          path: |
            reports/platform-comparison.json
            reports/workflow-comparison.json
            reports/protocol-comparison.json
            reports/human-identity-comparison.json
            reports/readiness-evidence-comparison.json
            reports/eeg-benchmark-comparison.json
            reports/external-eeg-comparison.json
            reports/model-archive-comparison.json
          retention-days: 14
