[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "soma-neuro"
version = "0.25.0"
description = "Transparent numerical foundations for computational neuroscience"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "mne>=1.13,<2", "nibabel>=5.2,<6", "SimpleITK>=2.4,<3", "scikit-image>=0.24,<1", "neurodsp==2.3.0", "pandas>=2.2,<3", "matplotlib>=3.8,<4", "typer>=0.12,<1", "PyYAML>=6,<7", "scikit-learn>=1.5,<2", "pyriemann>=0.12,<0.13", "pybids>=0.22,<0.23", "bidsschematools>=2,<3", "nilearn>=0.14,<0.15"]

[project.optional-dependencies]
explorer = ["fastapi>=0.162,<0.163", "pydantic>=2.14,<3", "uvicorn>=0.54,<0.55", "httpx>=0.28,<0.29"]
dev = ["pytest>=8", "ruff>=0.9", "mypy>=1.13", "pandas-stubs", "types-PyYAML", "bids-validator-deno==3.0.2", "build>=1.2,<2"]

[project.scripts]
soma = "soma.cli:app"
soma-explorer = "soma.sdk.explorer:main"

[tool.hatch.build.targets.wheel]
packages = ["src/soma", "services"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/services", "/configs", "/docs", "/examples", "/scripts", "/tests", "/experiments/milestone141/verification.json", "/README.md", "/CHANGELOG.md", "/pyproject.toml"]
exclude = ["*.local.json", "__pycache__", "*.pyc", ".env*", "*.nii*", "*.edf", "*.fif", "*.npz", "*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not integration'"
markers = ["integration: requires explicitly cached EEG, anatomical templates, or structural MRI"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
untyped_calls_exclude = ["nibabel", "SimpleITK", "skimage"]
[[tool.mypy.overrides]]
module = ["mne.*", "neurodsp.*", "scipy.*", "matplotlib.*", "mpl_toolkits.*", "sklearn.*", "pyriemann.*", "threadpoolctl.*", "nibabel.*", "SimpleITK.*", "skimage.*", "bids.*", "bids_validator.*", "bidsschematools.*", "deno.*", "nilearn.*"]
ignore_missing_imports = true
